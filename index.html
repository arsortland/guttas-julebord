<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guttas julebord 2026</title>
<meta property="og:title" content="Guttas julebord 2026">
<meta property="og:description" content="Stem på dato og sted. Resultatene oppdateres fortløpende.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<style>
  :root {
    --bg: #10201a;
    --panel: #172b23;
    --line: #29443a;
    --text: #f3efe6;
    --muted: #a3b5ab;
    --accent: #e0b354;
    --accent-ink: #2a1f06;
    --fill: #24503f;
    --fill-mine: #7a2e35;
    --danger: #ff9d8f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 64px; }
  header { margin-bottom: 22px; }
  .eyebrow { color: var(--accent); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 38px; line-height: 1.05; margin: 6px 0 8px; font-weight: 700; }
  header p { margin: 0; color: var(--muted); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 14px; }
  h2 { font-size: 18px; margin: 0 0 2px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--text);
    background: #0d1a15; border: 1px solid var(--line); border-radius: 10px;
  }
  input[type=text]::placeholder { color: #6f8279; }
  input[type=text]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input.missing { border-color: var(--danger); }
  .week { color: var(--accent); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; margin: 14px 0 6px; }
  .week:first-of-type { margin-top: 4px; }
  .opt {
    position: relative; display: block; width: 100%; text-align: left; overflow: hidden;
    padding: 11px 12px; margin-top: 8px; font: inherit; color: var(--text); cursor: pointer;
    background: #0d1a15; border: 1px solid var(--line); border-radius: 10px;
  }
  .opt .bar { position: absolute; inset: 0 auto 0 0; background: var(--fill); transition: width .35s ease; }
  .opt[aria-pressed=true] { border-color: var(--accent); }
  .opt[aria-pressed=true] .bar { background: var(--fill-mine); }
  .opt .row { position: relative; display: flex; align-items: center; gap: 10px; }
  .box {
    flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted);
    display: grid; place-items: center; font-size: 14px; font-weight: 700; color: transparent;
  }
  .opt[aria-pressed=true] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .name { flex: 1; font-weight: 600; overflow-wrap: anywhere; }
  .lead { font-size: 12px; color: var(--accent); font-weight: 600; white-space: nowrap; }
  .count { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 1.5em; text-align: right; }
  .who { position: relative; color: var(--muted); font-size: 13px; margin: 4px 0 0 32px; overflow-wrap: anywhere; }
  .add { display: flex; gap: 8px; margin-top: 12px; }
  .add input { flex: 1; min-width: 0; }
  .btn {
    flex: none; padding: 12px 16px; font: inherit; font-weight: 700; cursor: pointer;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 10px;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  .empty { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  #status { color: var(--muted); font-size: 13px; margin-top: 14px; text-align: center; min-height: 1.4em; }
  #status.err { color: var(--danger); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5fd08a; margin-right: 6px; }
  #status.err .dot { background: var(--danger); }
  @media (prefers-reduced-motion: reduce) { .opt .bar { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Avstemning</div>
    <h1>Guttas julebord 2026</h1>
    <p>Kryss av alle datoene du kan, og stem på eller foreslå sted. Du kan endre svarene dine når som helst.</p>
  </header>

  <section>
    <label for="name">Hva heter du?</label>
    <input type="text" id="name" maxlength="30" autocomplete="given-name" placeholder="Navnet ditt">
  </section>

  <section>
    <h2>Når passer det?</h2>
    <p class="hint">Velg så mange du vil.</p>
    <div id="dates"></div>
  </section>

  <section>
    <h2>Hvor skal vi være?</h2>
    <p class="hint">Stem på ett eller flere steder, eller legg til ditt eget forslag.</p>
    <div id="places"></div>
    <form class="add" id="addForm">
      <input type="text" id="placeInput" maxlength="50" placeholder="Foreslå et sted" aria-label="Foreslå et sted">
      <button class="btn" id="addBtn" type="submit">Legg til</button>
    </form>
  </section>

  <div id="status" role="status">Laster …</div>
</main>

<script>
(() => {
  const DATES = [
    { week: 'Uke 49', id: '2026-12-04', label: 'Fredag 4. desember' },
    { week: 'Uke 49', id: '2026-12-05', label: 'Lørdag 5. desember' },
    { week: 'Uke 50', id: '2026-12-11', label: 'Fredag 11. desember' },
    { week: 'Uke 50', id: '2026-12-12', label: 'Lørdag 12. desember' },
    { week: 'Uke 51', id: '2026-12-18', label: 'Fredag 18. desember' },
    { week: 'Uke 51', id: '2026-12-19', label: 'Lørdag 19. desember' },
  ];
  const API = '/api/poll';
  const REFRESH_MS = 4000;

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  let voterId = store.get('jb-voter');
  if (!voterId) {
    voterId = (crypto.randomUUID ? crypto.randomUUID() : 'v-' + Date.now() + '-' + Math.random().toString(36).slice(2, 12));
    store.set('jb-voter', voterId);
  }

  const mine = { dates: new Set(), places: new Set() };
  let server = { votes: [], places: [] };
  let loaded = false, hydrated = false, dirty = false, saving = false, saveTimer = null, lastOk = 0;

  $('name').value = store.get('jb-name') || '';

  function setStatus(text, isErr) {
    const el = $('status');
    el.className = isErr ? 'err' : '';
    el.textContent = '';
    if (text) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      el.append(dot, text);
    }
  }

  // Stemmene slik de skal vises: serverens, med mine egne ulagrede valg lagt oppå.
  function tally(kind, id) {
    const names = [];
    for (const v of server.votes) {
      if (v.id === voterId) continue;
      if ((v[kind] || []).includes(id)) names.push(v.name);
    }
    if (mine[kind].has(id)) names.push(($('name').value.trim() || 'Du') + ' (deg)');
    return names;
  }

  function option(kind, id, label, max) {
    const names = tally(kind, id);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    btn.setAttribute('aria-pressed', mine[kind].has(id) ? 'true' : 'false');

    const bar = document.createElement('span');
    bar.className = 'bar';
    bar.style.width = max ? (names.length / max) * 100 + '%' : '0%';

    const row = document.createElement('span');
    row.className = 'row';
    const box = document.createElement('span');
    box.className = 'box';
    box.textContent = '✓';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = label;
    row.append(box, name);
    if (max && names.length === max) {
      const lead = document.createElement('span');
      lead.className = 'lead';
      lead.textContent = 'Leder';
      row.append(lead);
    }
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = names.length;
    row.append(count);

    btn.append(bar, row);
    if (names.length) {
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = names.join(', ');
      btn.append(who);
    }
    btn.setAttribute('aria-label', label + ', ' + names.length + (names.length === 1 ? ' stemme' : ' stemmer'));
    btn.addEventListener('click', () => toggle(kind, id));
    return btn;
  }

  function render() {
    const dateMax = Math.max(0, ...DATES.map((d) => tally('dates', d.id).length));
    const datesEl = $('dates');
    datesEl.textContent = '';
    let week = '';
    for (const d of DATES) {
      if (d.week !== week) {
        week = d.week;
        const h = document.createElement('div');
        h.className = 'week';
        h.textContent = week;
        datesEl.append(h);
      }
      datesEl.append(option('dates', d.id, d.label, dateMax));
    }

    const placesEl = $('places');
    placesEl.textContent = '';
    if (!server.places.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = loaded ? 'Ingen forslag ennå. Kom med det første!' : '';
      placesEl.append(p);
    } else {
      const placeMax = Math.max(0, ...server.places.map((p) => tally('places', p.id).length));
      const sorted = [...server.places].sort((a, b) => tally('places', b.id).length - tally('places', a.id).length);
      for (const p of sorted) placesEl.append(option('places', p.id, p.name, placeMax));
    }
  }

  function applyServer(data) {
    server = { votes: data.votes || [], places: data.places || [] };
    loaded = true;
    lastOk = Date.now();
    const my = server.votes.find((v) => v.id === voterId);
    // Hent mine lagrede valg første gang; etterpå styrer det jeg har trykket på her.
    if (!hydrated) {
      hydrated = true;
      if (my) {
        mine.dates = new Set(my.dates || []);
        mine.places = new Set(my.places || []);
        if (!$('name').value) $('name').value = my.name || '';
      }
    }
    const count = server.votes.filter((v) => (v.dates || []).length || (v.places || []).length).length;
    setStatus(count + (count === 1 ? ' har stemt' : ' har stemt') + ' · oppdateres automatisk');
    render();
  }

  async function call(options) {
    const res = await fetch(API, { cache: 'no-store', ...options });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Fikk ikke kontakt med serveren.');
    return data;
  }

  async function refresh() {
    if (document.hidden || saving || dirty) return;
    try {
      const data = await call();
      if (!saving && !dirty) applyServer(data);
    } catch (e) {
      if (Date.now() - lastOk > 12000) setStatus(e.message, true);
    }
  }

  function needName() {
    const input = $('name');
    if (input.value.trim()) { input.classList.remove('missing'); return false; }
    input.classList.add('missing');
    input.focus();
    setStatus('Skriv inn navnet ditt først.', true);
    return true;
  }

  function toggle(kind, id) {
    if (needName()) return;
    mine[kind].has(id) ? mine[kind].delete(id) : mine[kind].add(id);
    render();
    queueSave();
  }

  function queueSave() {
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 500);
  }

  async function save() {
    if (saving) { queueSave(); return; }
    const name = $('name').value.trim();
    if (!name) return;
    saving = true;
    dirty = false;
    try {
      const data = await call({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'vote', voterId, name, dates: [...mine.dates], places: [...mine.places] }),
      });
      saving = false;
      if (!dirty) applyServer(data);
    } catch (e) {
      saving = false;
      dirty = true;
      setStatus(e.message + ' Stemmen din er ikke lagret ennå.', true);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 4000);
    }
  }

  $('name').addEventListener('input', () => {
    const input = $('name');
    if (input.value.trim()) input.classList.remove('missing');
    store.set('jb-name', input.value.trim());
    render();
    if (mine.dates.size || mine.places.size) queueSave();
  });

  $('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = $('placeInput');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    if (needName()) return;
    $('addBtn').disabled = true;
    try {
      const data = await call({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'addPlace', name }),
      });
      input.value = '';
      server.places = data.places || server.places;
      if (data.placeId) mine.places.add(data.placeId);
      render();
      queueSave();
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      $('addBtn').disabled = false;
    }
  });

  render();
  refresh();
  setInterval(refresh, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
